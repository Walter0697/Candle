name: Deploy on Release

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      NODE_OPTIONS: --max_old_space_size=6144

    steps:
      - name: Debug workflow run info
        run: |
          echo "Workflow run triggered!"
          echo "Workflow name: ${{ github.event.workflow_run.name }}"
          echo "Workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow status: ${{ github.event.workflow_run.status }}"
          echo "Workflow URL: ${{ github.event.workflow_run.html_url }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy

      - name: Log deployment
        run: |
          echo "✅ Successfully deployed to GitHub Pages"
          echo "🌐 Site URL: https://Walter0697.github.io/Candle/"
          echo "📅 Deployed at: $(date)"
          echo "📦 Triggered by: ${{ github.event.workflow_run.name }}"
          echo "🔗 Workflow URL: ${{ github.event.workflow_run.html_url }}"
