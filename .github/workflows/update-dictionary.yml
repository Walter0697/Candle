name: Update Dictionary

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: "false"
        type: boolean

jobs:
  update-dictionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

       - name: Install dependencies
         run: |
           npm install js-yaml dayjs

      - name: Create output directory
        run: mkdir -p output

       - name: Run dictionary update script
         run: |
           cd scripts
           node update-dictionary.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create branch and commit changes
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create a new branch with timestamp
          BRANCH_NAME="update-dictionary-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME

           # Add and commit changes
           git add output/
           git add src/dictionaries/dictionary.js
           git add src/dictionaries/wordbank.js
           git add src/dictionaries/duplicates.js
           git add src/dictionaries/pronunciation.js
           git commit -m "Update dictionary from rime-cantonese source

           - Updated dictionary.js with latest entries
           - Updated wordbank.js with complete word bank
           - Updated duplicates.js with duplicate entries
           - Updated pronunciation.js with pronunciation mappings
           - Updated initial and final sound lists

           Generated on: $(date)"

          # Push the branch
          git push origin $BRANCH_NAME

          # Store branch name for PR creation
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Update Dictionary - ${new Date().toISOString().split('T')[0]}`,
              head: process.env.BRANCH_NAME,
              base: 'develop',
              body: `## Dictionary Update

              This PR updates the dictionary with the latest entries from the rime-cantonese source.

               ### Changes:
               - 📚 Updated dictionary.js with latest entries
               - 📖 Updated wordbank.js with complete word bank
               - 🔍 Updated duplicates.js with duplicate entries
               - 🔊 Updated pronunciation.js with pronunciation mappings
               - 🎵 Updated initial and final sound lists

              ### Updated Files:
              - \`src/dictionaries/dictionary.js\` - Main dictionary entries
              - \`src/dictionaries/wordbank.js\` - Complete word bank
              - \`src/dictionaries/duplicates.js\` - Duplicate entries
              - \`src/dictionaries/pronunciation.js\` - Pronunciation mappings

              ### Generated JSON Files:
              - \`output/wordbank.json\` - Complete word bank
              - \`output/dictionary.json\` - Dictionary entries
              - \`output/pronunciation.json\` - Pronunciation mappings
              - \`output/initial.json\` - Initial sounds
              - \`output/final.json\` - Final sounds
              - \`output/duplicates.json\` - Duplicate entries

              ### Source:
              - **Candle Dictionary**: https://raw.githubusercontent.com/Walter0697/Candle/develop/src/dictionaries/dictionary.js
              - **Rime Cantonese**: https://raw.githubusercontent.com/rime/rime-cantonese/main/jyut6ping3.words.dict.yaml

              ---
              *This PR was automatically generated by the dictionary update workflow.*`,
              labels: ['automated', 'dictionary-update']
            });

            console.log(`Created PR #${pr.number}: ${pr.html_url}`);

      - name: Comment on PR with details
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR number from the previous step
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${process.env.BRANCH_NAME}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const pr = prs[0];
              
              // Read the generated files to get stats
              const fs = require('fs');
              let stats = '';
              
              try {
                const wordbank = JSON.parse(fs.readFileSync('output/wordbank.json', 'utf8'));
                const dictionary = JSON.parse(fs.readFileSync('output/dictionary.json', 'utf8'));
                const duplicates = JSON.parse(fs.readFileSync('output/duplicates.json', 'utf8'));
                
                stats = `## 📊 Update Statistics
                
                - **Total Words**: ${wordbank.length}
                - **Dictionary Entries**: ${dictionary.length}
                - **Duplicates Found**: ${duplicates.length}
                
                ### 🕒 Generated at: ${new Date().toISOString()}`;
              } catch (error) {
                stats = `## 📊 Update Statistics
                
                *Unable to read statistics due to: ${error.message}*`;
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: stats
              });
            }
