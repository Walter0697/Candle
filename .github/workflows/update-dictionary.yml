name: Update Dictionary

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        default: "false"
        type: boolean

jobs:
  update-dictionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install js-yaml dayjs

      - name: Create output directory
        run: mkdir -p output

      - name: Get current dictionary stats
        id: before_stats
        run: |
          cd scripts
          # Get current stats before update
          CURRENT_DICT=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('../src/dictionaries/dictionary.js', 'utf8');
            const match = content.match(/const dictionary = (\[[\s\S]*?\]);/);
            if (match) {
              const dict = JSON.parse(match[1]);
              console.log(dict.length);
            } else {
              console.log('0');
            }
          ")
          CURRENT_WORDBANK=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('../src/dictionaries/wordbank.js', 'utf8');
            const match = content.match(/const wordbank = (\[[\s\S]*?\]);/);
            if (match) {
              const wordbank = JSON.parse(match[1]);
              console.log(wordbank.length);
            } else {
              console.log('0');
            }
          ")
          CURRENT_DUPLICATES=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('../src/dictionaries/duplicates.js', 'utf8');
            const match = content.match(/const duplicates = (\[[\s\S]*?\]);/);
            if (match) {
              const duplicates = JSON.parse(match[1]);
              console.log(duplicates.length);
            } else {
              console.log('0');
            }
          ")
          echo "current_dict=$CURRENT_DICT" >> $GITHUB_OUTPUT
          echo "current_wordbank=$CURRENT_WORDBANK" >> $GITHUB_OUTPUT
          echo "current_duplicates=$CURRENT_DUPLICATES" >> $GITHUB_OUTPUT
          echo "📊 Current stats: Dict=$CURRENT_DICT, Wordbank=$CURRENT_WORDBANK, Duplicates=$CURRENT_DUPLICATES"

      - name: Run dictionary update script
        run: |
          cd scripts
          node update-dictionary.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create branch and commit changes
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create a new branch with timestamp
          BRANCH_NAME="update-dictionary-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME

          # Add and commit changes (dictionary files only)
          git add src/dictionaries/dictionary.js
          git add src/dictionaries/wordbank.js
          git add src/dictionaries/duplicates.js
          git add src/dictionaries/pronunciation.js
          git commit -m "chore(dictionary): update from rime-cantonese source

          - Updated dictionary.js with latest entries
          - Updated wordbank.js with complete word bank
          - Updated duplicates.js with duplicate entries
          - Updated pronunciation.js with pronunciation mappings
          - Updated initial and final sound lists

          Generated on: $(date)"

          # Push the branch
          git push origin $BRANCH_NAME

          # Store branch name for PR creation
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Determine PR title and auto-merge based on changes
            const fs = require('fs');
            let prTitle = `🔄 Update Dictionary - ${new Date().toISOString().split('T')[0]}`;
            let autoMerge = false;

            try {
              // Read the JS files to get new stats
              const dictContent = fs.readFileSync('src/dictionaries/dictionary.js', 'utf8');
              const wordbankContent = fs.readFileSync('src/dictionaries/wordbank.js', 'utf8');
              const duplicatesContent = fs.readFileSync('src/dictionaries/duplicates.js', 'utf8');
              
              // Parse the JS files
              const dictMatch = dictContent.match(/const dictionary = (\[[\s\S]*?\]);/);
              const wordbankMatch = wordbankContent.match(/const wordbank = (\[[\s\S]*?\]);/);
              const duplicatesMatch = duplicatesContent.match(/const duplicates = (\[[\s\S]*?\]);/);
              
              const dictionary = dictMatch ? JSON.parse(dictMatch[1]) : [];
              const wordbank = wordbankMatch ? JSON.parse(wordbankMatch[1]) : [];
              const duplicates = duplicatesMatch ? JSON.parse(duplicatesMatch[1]) : [];
              
              const newDict = dictionary.length;
              const newWordbank = wordbank.length;
              const newDuplicates = duplicates.length;
              
              const oldDict = process.env.CURRENT_DICT || '0';
              const oldWordbank = process.env.CURRENT_WORDBANK || '0';
              const oldDuplicates = process.env.CURRENT_DUPLICATES || '0';
              
              const dictDiff = newDict - parseInt(oldDict);
              const wordbankDiff = newWordbank - parseInt(oldWordbank);
              const duplicatesDiff = newDuplicates - parseInt(oldDuplicates);
              
              // All dictionary updates are treated as maintenance
              prTitle = `🔧 Dictionary Maintenance - ${new Date().toISOString().split('T')[0]}`;

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: process.env.BRANCH_NAME,
                base: 'shumai',
                body: `## Dictionary Update

                This PR updates the dictionary with the latest entries from the rime-cantonese source.

                ### 📊 Change Summary:
                - **Dictionary**: ${oldDict} → ${newDict} (${dictDiff > 0 ? '+' : ''}${dictDiff})
                - **Wordbank**: ${oldWordbank} → ${newWordbank} (${wordbankDiff > 0 ? '+' : ''}${wordbankDiff})
                - **Duplicates**: ${oldDuplicates} → ${newDuplicates} (${duplicatesDiff > 0 ? '+' : ''}${duplicatesDiff})

                ### Changes:
                - 📚 Updated dictionary.js with latest entries
                - 📖 Updated wordbank.js with complete word bank
                - 🔍 Updated duplicates.js with duplicate entries
                - 🔊 Updated pronunciation.js with pronunciation mappings
                - 🎵 Updated initial and final sound lists

                ### Updated Files:
                - \`src/dictionaries/dictionary.js\` - Main dictionary entries
                - \`src/dictionaries/wordbank.js\` - Complete word bank
                - \`src/dictionaries/duplicates.js\` - Duplicate entries
                - \`src/dictionaries/pronunciation.js\` - Pronunciation mappings

                ### Source:
                - **Candle Dictionary**: https://raw.githubusercontent.com/Walter0697/Candle/develop/src/dictionaries/dictionary.js
                - **Rime Cantonese**: https://raw.githubusercontent.com/rime/rime-cantonese/main/jyut6ping3.words.dict.yaml

                ---
                *This PR was automatically generated by the dictionary update workflow.*`,
                labels: autoMerge ? ['automated', 'dictionary-update', 'auto-merge'] : ['automated', 'dictionary-update', 'manual-review']
              });

              console.log(`Created PR #${pr.number}: ${pr.html_url}`);
              console.log(`Auto-merge: ${autoMerge}`);
              
              // Store PR info for auto-merge
              if (autoMerge) {
                console.log(`AUTO_MERGE_PR=${pr.number}` >> process.env.GITHUB_ENV);
              }
              
            } catch (error) {
              console.log('Error creating PR:', error);
              // Fallback PR creation
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: process.env.BRANCH_NAME,
                base: 'shumai',
                body: `## Dictionary Update

                This PR updates the dictionary with the latest entries from the rime-cantonese source.

                ### Updated Files:
                - \`src/dictionaries/dictionary.js\` - Main dictionary entries
                - \`src/dictionaries/wordbank.js\` - Complete word bank
                - \`src/dictionaries/duplicates.js\` - Duplicate entries
                - \`src/dictionaries/pronunciation.js\` - Pronunciation mappings

                ---
                *This PR was automatically generated by the dictionary update workflow.*`,
                labels: ['automated', 'dictionary-update']
              });
              
              console.log(`Created fallback PR #${pr.number}: ${pr.html_url}`);
            }

      - name: Comment on PR with detailed stats
        if: steps.changes.outputs.changes == 'true' || github.event.inputs.force_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR number from the previous step
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${process.env.BRANCH_NAME}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const pr = prs[0];
              
              // Read the generated files to get detailed stats
              const fs = require('fs');
              let stats = '';
              
              try {
                // Read the JS files to get new stats
                const dictContent = fs.readFileSync('src/dictionaries/dictionary.js', 'utf8');
                const wordbankContent = fs.readFileSync('src/dictionaries/wordbank.js', 'utf8');
                const duplicatesContent = fs.readFileSync('src/dictionaries/duplicates.js', 'utf8');
                
                // Parse the JS files
                const dictMatch = dictContent.match(/const dictionary = (\[[\s\S]*?\]);/);
                const wordbankMatch = wordbankContent.match(/const wordbank = (\[[\s\S]*?\]);/);
                const duplicatesMatch = duplicatesContent.match(/const duplicates = (\[[\s\S]*?\]);/);
                
                const dictionary = dictMatch ? JSON.parse(dictMatch[1]) : [];
                const wordbank = wordbankMatch ? JSON.parse(wordbankMatch[1]) : [];
                const duplicates = duplicatesMatch ? JSON.parse(duplicatesMatch[1]) : [];
                
                const newDict = dictionary.length;
                const newWordbank = wordbank.length;
                const newDuplicates = duplicates.length;
                
                const oldDict = process.env.CURRENT_DICT || '0';
                const oldWordbank = process.env.CURRENT_WORDBANK || '0';
                const oldDuplicates = process.env.CURRENT_DUPLICATES || '0';
                
                const dictDiff = newDict - parseInt(oldDict);
                const wordbankDiff = newWordbank - parseInt(oldWordbank);
                const duplicatesDiff = newDuplicates - parseInt(oldDuplicates);
                
                stats = `## 📊 Detailed Update Statistics
                
                ### Before vs After:
                | File | Before | After | Change |
                |------|--------|-------|--------|
                | Dictionary | ${oldDict} | ${newDict} | ${dictDiff > 0 ? '+' : ''}${dictDiff} |
                | Wordbank | ${oldWordbank} | ${newWordbank} | ${wordbankDiff > 0 ? '+' : ''}${wordbankDiff} |
                | Duplicates | ${oldDuplicates} | ${newDuplicates} | ${duplicatesDiff > 0 ? '+' : ''}${duplicatesDiff} |
                
                ### Summary:
                - **Total Words**: ${newWordbank} (${wordbankDiff > 0 ? '+' : ''}${wordbankDiff})
                - **Dictionary Entries**: ${newDict} (${dictDiff > 0 ? '+' : ''}${dictDiff})
                - **Duplicates Found**: ${newDuplicates} (${duplicatesDiff > 0 ? '+' : ''}${duplicatesDiff})
                
                ### 🕒 Generated at: ${new Date().toISOString()}`;
              } catch (error) {
                stats = `## 📊 Update Statistics
                
                *Unable to read detailed statistics due to: ${error.message}*`;
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: stats
              });
            }
